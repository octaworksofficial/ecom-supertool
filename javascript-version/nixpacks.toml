# Nixpacks configuration for Railway deployment - No Cache Mounts

[phases.setup]
nixPkgs = ["nodejs_18", "openssl", "sqlite"]

[phases.install]
cmds = [
    "export npm_config_cache=/tmp/npm-cache",
    "mkdir -p /tmp/npm-cache", 
    "npm ci --prefer-offline --no-audit --omit=dev --cache=/tmp/npm-cache",
    "npx prisma generate"
]

[phases.build] 
cmds = [
    "npx prisma db push --accept-data-loss",
    "npm run build"
]

[start]
cmd = "npm start"

[variables]
NODE_ENV = "production"
PRISMA_CLI_QUERY_ENGINE_TYPE = "binary"

# Disable Docker cache mounts to prevent EBUSY errors
[build]
cmd = "echo 'Using custom build process'"